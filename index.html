<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SK electlink Recruitment Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --sk-red: #E6221A; --sk-orange: #F37021; --sk-light-gray: #f0f2f5; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--sk-light-gray); padding: 20px; }
        .header { background: linear-gradient(90deg, var(--sk-red), var(--sk-orange)); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .metric-card { background: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--sk-red); }
        .metric-value { font-size: 1.8rem; font-weight: bold; color: var(--sk-red); }
        .main-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; min-height: 350px; }
        .full-width { grid-column: 1 / -1; }
        .chart-box { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>
    <div class="header"><h1>SK electlink Recruitment Dashboard ⚡</h1></div>
    <div class="metric-grid">
        <div class="metric-card"><h3>진행 중 공고</h3><div id="openCount" class="metric-value">-</div></div>
        <div class="metric-card"><h3>평균 리드타임</h3><div id="avgLeadTime" class="metric-value">-</div></div>
        <div class="metric-card"><h3>마지막 업데이트</h3><div id="updateTime" class="metric-value">-</div></div>
    </div>
    <div class="main-grid">
        <div class="card full-width"><h2>월별 채용 완료 추이</h2><div class="chart-box"><canvas id="monthlyChart"></canvas></div></div>
        <div class="card"><h2>팀별 현황 (진행중)</h2><div class="chart-box"><canvas id="teamChart"></canvas></div></div>
        <div class="card"><h2>형태/사유 (진행중)</h2><div class="chart-box"><canvas id="ratioChart"></canvas></div></div>
    </div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwiIPeRHxc6tu3ZU_7KrzkkKxNjmKGnsFKk8Dj5qv7kv600cxNsldyg1WFo4rHE-LuIfaA/exec"; 

    async function fetchData() {
        try {
            const res = await fetch(`${GAS_URL}?t=${Date.now()}`);
            const json = await res.json();
            if (json.status === "success") render(json.positions);
        } catch (e) { document.getElementById('updateTime').innerText = "연결 실패"; }
    }

    function parseDate(d) {
        if (!d) return null;
        const date = new Date(d);
        return isNaN(date.getTime()) ? null : date;
    }

    function render(rows) {
        const data = rows.slice(1);
        const active = data.filter(r => String(r[4] || '').trim() === '진행중');
        const completed = data.filter(r => String(r[4] || '').trim() === '완료');

        document.getElementById('openCount').innerText = active.length + "건";
        document.getElementById('updateTime').innerText = new Date().toLocaleTimeString();

        // 리드타임 계산 (오류 방지형)
        let totalLT = 0, countLT = 0;
        completed.forEach(r => {
            const start = parseDate(r[5]), end = parseDate(r[6]);
            if (start && end) {
                totalLT += (end - start) / 86400000;
                countLT++;
            }
        });
        document.getElementById('avgLeadTime').innerText = (countLT ? Math.round(totalLT / countLT) : 0) + "일";

        // 차트 1: 월별 추이
        const months = {};
        completed.forEach(r => {
            const d = parseDate(r[6]);
            if (d) {
                const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
                months[k] = (months[k] || 0) + 1;
            }
        });
        const mLabels = Object.keys(months).sort();
        draw('monthlyChart', 'line', mLabels, [{label:'완료', data:mLabels.map(l=>months[l]), borderColor:'#E6221A'}]);

        // 차트 2: 팀별
        const teams = {};
        active.forEach(r => { if(r[1]) teams[r[1]] = (teams[r[1]] || 0) + 1; });
        draw('teamChart', 'doughnut', Object.keys(teams), [{data:Object.values(teams), backgroundColor:['#E6221A','#F37021','#FFB400','#53565A','#7B42FF']}]);

        // 차트 3: 사유/형태
        const p = active.filter(r => String(r[7]).includes('정규직')).length;
        const c = active.filter(r => String(r[7]).includes('계약직')).length;
        const n = active.filter(r => String(r[8]).includes('신규')).length;
        const s = active.filter(r => String(r[8]).includes('대체')).length;
        draw('ratioChart', 'bar', ['정규직','계약직','신규','대체'], [{label:'건수', data:[p,c,n,s], backgroundColor:['#53565A','#53565A','#F37021','#F37021']}]);
    }

    function draw(id, type, labels, datasets) {
        const ctx = document.getElementById(id).getContext('2d');
        if (window[id + 'Chart']) window[id + 'Chart'].destroy();
        window[id + 'Chart'] = new Chart(ctx, {
            type, data: {labels, datasets},
            options: { responsive:true, maintainAspectRatio:false }
        });
    }
    fetchData();
</script>
</body></html>
